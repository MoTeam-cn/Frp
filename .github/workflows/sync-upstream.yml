name: Sync Upstream Tag

# 每小时检查上游 fatedier/frp 是否有新 tag，若有则同步到 MoTeam-cn/Frp。
# 同步策略：
#   1. 创建与上游同名的 tag，指向「上游 tag 提交 + 保留 MoTeam 自定义」的新提交
#   2. 受保护文件（不被上游覆盖）：
#      - .github/workflows/   自定义工作流
#      - README.md            自定义版本
#      - README_zh.md         已删除，确保不被上游恢复
#   3. 主分支 dev 通过 merge -X theirs 合并上游代码，冲突时上游获胜，
#      但受保护文件在合并后强制还原为本仓库版本
#   4. 同步完成后 push dev 和 tag，触发 goreleaser.yml 构建工作流
#   注：MoTeam-cn/Frp 默认分支为 dev（不是 main）
#
# Bug 修复记录：
#   - git tag 无 --remote 选项，改用 git ls-remote --tags upstream
#   - git fetch upstream --tags 会把上游 tag 拉到本地 refs/tags/，
#     导致 git rev-parse --verify refs/tags/$TAG 始终为 true，
#     改用 git ls-remote --tags origin 检查本仓库是否已有该 tag
#   - git merge upstream/$TAG 不正确（upstream/ 前缀用于分支不用于 tag），
#     改用 git merge refs/tags/$TAG

on:
  schedule:
    # 每小时整点检查（UTC 时间）
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的上游 tag（如 v0.62.0），留空则自动检测最新 tag'
        required: false
        default: ''
      force:
        description: '强制同步（即使 tag 已存在也重新创建）'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstream tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MoTeam-cn/Frp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/fatedier/frp.git
          # 只 fetch 上游的 tag 和 master 分支引用，不 fetch 全部分支
          git fetch upstream --tags --no-recurse-submodules

      - name: Determine target tag
        id: target
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"

          if [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
          else
            # 获取上游最新 tag（按版本号倒序）
            # 注意：git tag 无 --remote 选项，必须用 git ls-remote --tags
            # grep -v '\^{}$' 过滤掉 peeled tag 引用
            TARGET_TAG=$(git ls-remote --tags upstream \
              | grep -v '\^{}$' \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | sort -V -r \
              | head -1)
          fi

          if [ -z "$TARGET_TAG" ]; then
            echo "::error::未找到上游 tag"
            echo "should_sync=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "上游目标 tag: $TARGET_TAG"

          # 检查本仓库（origin 远程）是否已存在该 tag
          # 注意：不能用 git rev-parse --verify refs/tags/$TARGET_TAG，
          # 因为 git fetch upstream --tags 会把上游 tag 拉到本地 refs/tags/，
          # 导致检查始终为 true。必须用 git ls-remote 检查 origin 远程。
          if git ls-remote --tags origin | grep -q "refs/tags/${TARGET_TAG}$"; then
            if [ "$FORCE" = "true" ]; then
              echo "::notice::tag $TARGET_TAG 已存在于 origin，强制同步模式"
              echo "should_sync=true" >> $GITHUB_OUTPUT
            else
              echo "::notice::tag $TARGET_TAG 已存在于 origin，跳过同步"
              echo "should_sync=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "::notice::tag $TARGET_TAG 不存在于 origin，需要同步"
            echo "should_sync=true" >> $GITHUB_OUTPUT
          fi

          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT

      - name: Sync tag to MoTeam-cn/Frp
        if: steps.target.outputs.should_sync == 'true'
        run: |
          TARGET_TAG="${{ steps.target.outputs.tag }}"
          echo "::group::同步上游 tag $TARGET_TAG"

          # 1. 备份本仓库受保护文件
          mkdir -p /tmp/protected/.github/workflows
          cp -r .github/workflows/* /tmp/protected/.github/workflows/ 2>/dev/null || true
          cp README.md /tmp/protected/README.md

          # 2. 合并上游 tag 到 dev（-X theirs：冲突时上游获胜）
          #    注意：tag 引用是 refs/tags/$TAG，不是 upstream/$TAG（那是分支引用）
          #    --allow-unrelated-histories：允许合并无共同历史的分支（保险起见保留）
          git merge "refs/tags/$TARGET_TAG" \
            --no-edit \
            --strategy-option=theirs \
            --allow-unrelated-histories || {
              # 即使有无法自动解决的冲突，也继续（后续会强制覆盖受保护文件）
            echo "::warning::合并存在冲突，将强制完成合并并覆盖受保护文件"
            git add -A
            git commit --no-edit || true
          }

          # 3. 还原受保护文件
          mkdir -p .github/workflows
          cp -r /tmp/protected/.github/workflows/* .github/workflows/
          cp /tmp/protected/README.md .

          # 4. 确保 README_zh.md 保持删除状态（上游可能恢复它）
          if [ -f README_zh.md ]; then
            git rm -f README_zh.md
            echo "::notice::已删除上游恢复的 README_zh.md"
          fi

          # 5. 提交受保护文件的还原
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: preserve MoTeam customizations for $TARGET_TAG

          - 保留自定义 .github/workflows/
          - 保留修改后的 README.md
          - 保持 README_zh.md 删除状态
          "
          else
            echo "::notice::受保护文件无需还原"
          fi

          # 6. 推送 dev 分支
          git push origin dev

          # 7. 创建并推送同名 tag
          #    如果 tag 已存在（force 模式），用 -f 强制覆盖
          git tag -f "$TARGET_TAG"
          git push origin "$TARGET_TAG" --force

          echo "::endgroup::"
          echo "::notice::同步完成：dev + tag $TARGET_TAG 已推送"

      - name: Summary
        if: always()
        run: |
          echo "## 上游同步结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.target.outputs.should_sync }}" = "true" ]; then
            echo "✅ 已同步上游 tag \`${{ steps.target.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "下一步：tag 推送将自动触发 [\`goreleaser.yml\`](./goreleaser.yml) 工作流构建并上传到 apiServer" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 无需同步（tag 已存在或未找到上游新 tag）" >> $GITHUB_STEP_SUMMARY
          fi
